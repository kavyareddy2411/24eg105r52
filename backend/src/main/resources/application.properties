# ---------- Server ----------
# Render injects PORT automatically
server.port=${PORT:8080}

# ---------- MySQL ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/parking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# ---------- JPA ----------
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# ---------- Security / JWT ----------
# JWT_SECRET must be at least 32 characters. Always override it in production.
app.jwt.secret=${JWT_SECRET:change-this-development-secret-key-at-least-32-chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ---------- Default admin (created on first start) ----------
app.admin.name=${ADMIN_NAME:Parking Admin}
app.admin.email=${ADMIN_EMAIL:admin@college.edu}
app.admin.password=${ADMIN_PASSWORD:Admin@123}

# ---------- Misc ----------
spring.jackson.default-property-inclusion=non_null
